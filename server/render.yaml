services:
  - type: web
    name: csbaby-sync-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8080
    disk:
      name: csbaby-data
      mountPath: /opt/render/project/src
      sizeGB: 1
