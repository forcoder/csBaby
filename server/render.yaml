services:
  - type: web
    name: csbaby-sync-server
    env: node
    plan: free
    buildCommand: npm install && node -e "console.log('Build OK, version:', require('./package.json').version)"
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8080
    autoDeploy: yes
# Force rebuild - clear cache