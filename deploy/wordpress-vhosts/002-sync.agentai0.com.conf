# sync.agentai0.com
# 部署到 WordPress 容器 /etc/apache2/sites-available/002-sync.agentai0.com.conf

<VirtualHost *:80>
    ServerName sync.agentai0.com
    Redirect permanent / https://sync.agentai0.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName sync.agentai0.com

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/sync.agentai0.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/sync.agentai0.com/privkey.pem

    SSLProtocol             all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          HIGH:!aNULL:!MD5
    SSLHonorCipherOrder     on

    ProxyPreserveHost       On
    ProxyPass               / http://csbaby-sync:8080/ timeout=120 retry=0
    ProxyPassReverse        / http://csbaby-sync:8080/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    ErrorLog  ${APACHE_LOG_DIR}/sync_error.log
    CustomLog ${APACHE_LOG_DIR}/sync_access.log combined
</VirtualHost>
