# api.agentai0.com
# 部署到 WordPress 容器 /etc/apache2/sites-available/001-api.agentai0.com.conf
# 由 deploy-on-server.sh 复制并 a2ensite

<VirtualHost *:80>
    ServerName api.agentai0.com
    Redirect permanent / https://api.agentai0.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName api.agentai0.com

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/api.agentai0.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/api.agentai0.com/privkey.pem

    SSLProtocol             all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          HIGH:!aNULL:!MD5
    SSLHonorCipherOrder     on

    # 透传到 backend 容器
    ProxyPreserveHost       On
    ProxyPass               / http://csbaby-api:8080/ timeout=120 retry=0
    ProxyPassReverse        / http://csbaby-api:8080/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    ErrorLog  ${APACHE_LOG_DIR}/api_error.log
    CustomLog ${APACHE_LOG_DIR}/api_access.log combined
</VirtualHost>
