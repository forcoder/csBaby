name: Server CI — Build, Test & Deploy

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'app/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'app/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────
  # Job 1: 安装依赖 + Lint + 测试
  # ─────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test

      - name: 语法检查（所有 JS 文件）
        run: |
          for f in src/*.js tests/*.js; do
            [ -f "$f" ] && node --check "$f" && echo "✅ $f"
          done

  # ─────────────────────────────────────────
  # Job 2: 部署到 Render（仅 main/master push）
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Render
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 触发 Render 部署（使用 API）
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          SERVICE_ID="srv-d85hdj3bc2fs73bqqeg0"

          echo "=== 使用 Render API 触发部署 ==="
          echo "Service ID: $SERVICE_ID"

          # 触发部署
          DEPLOY=$(curl -s -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys")

          echo "Deploy Response: $DEPLOY"

          DEPLOY_ID=$(echo "$DEPLOY" | node -e "
            let d=''; process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try {
                const j=JSON.parse(d);
                console.log(j.id || '');
              } catch(e) {console.log('');}
            });
          ")

          echo "Deploy ID: $DEPLOY_ID"

          if [ -n "$DEPLOY_ID" ]; then
            echo "✅ 部署已触发 (ID: $DEPLOY_ID)"
          else
            echo "❌ 部署触发失败"
            echo "$DEPLOY"
            exit 1
          fi

          # 保存 deploy ID 供后续使用
          echo "$DEPLOY_ID" > deploy_id.txt

      - name: 等待部署完成
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          DEPLOY_ID=$(cat deploy_id.txt)
          echo "等待部署 $DEPLOY_ID 完成..."

          for i in $(seq 1 30); do
            sleep 20

            STATUS=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/deploys/$DEPLOY_ID" | node -e "
                let d=''; process.stdin.on('data',c=>d+=c);
                process.stdin.on('end',()=>{
                  try {
                    const j=JSON.parse(d);
                    console.log(j.status || 'unknown');
                  } catch(e) {console.log('error');}
                });
              ")

            echo "Attempt $i: $STATUS"

            if [ "$STATUS" = "live" ]; then
              echo "✅ 部署完成！"
              exit 0
            elif [ "$STATUS" = "failed" ]; then
              echo "❌ 部署失败"
              exit 1
            fi

            [ $i -lt 30 ]
          done

          echo "⚠️ 部署超时"
          exit 1

      - name: 验证部署
        run: |
          echo "等待服务启动..."

          for i in $(seq 1 10); do
            RESPONSE=$(curl -s "https://csbaby-sync-server.onrender.com/")
            VERSION=$(echo "$RESPONSE" | grep -o '"version":"[^"]*"' 2>/dev/null | cut -d'"' -f4)
            echo "Attempt $i: Version=$VERSION"

            if [ -n "$VERSION" ] && [ "$VERSION" != "1.0.0" ]; then
              echo "✅ 新版本已部署: $VERSION"
              exit 0
            fi

            [ $i -lt 10 ] && sleep 15
          done

          echo "⚠️ 验证失败，仍为旧版本 1.0.0"