name: Deploy Sync Server to Render

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
  workflow_dispatch:

jobs:
  test:
    name: Test Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: |
          node -e "
          const { register, login } = require('./src/auth');
          (async () => {
            try {
              const r = await register('ci@test.com', 'test123456', 'CI Test');
              console.log('register ok');
              const l = await login('ci@test.com', 'test123456');
              console.log('login ok');
            } catch (e) {
              if (e.message === 'EMAIL_EXISTS') { console.log('user exists, ok'); return; }
              throw e;
            }
          })().catch(e => { console.error('TEST FAILED:', e.message); process.exit(1); });
          "

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Create Render Service & Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -e

          # 1. 查找现有服务
          echo "Listing services..."
          SERVICES=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services?limit=50")

          SERVICE_ID=$(echo "$SERVICES" | node -e "
            let d=''; process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try {
                const j = JSON.parse(d);
                if (Array.isArray(j)) {
                  const svc = j.find(s => s.service.name === 'csbaby-sync-server');
                  if (svc) { console.log(svc.service.id); return; }
                }
                console.log('NOT_FOUND');
              } catch(e) { console.log('NOT_FOUND'); }
            });
          ")
          echo "Service: $SERVICE_ID"

          # 2. 创建服务（如果不存在）
          if [ "$SERVICE_ID" = "NOT_FOUND" ]; then
            echo "Creating service..."

            # 写 JSON 到文件避免 shell 转义
            node -e "
              const fs = require('fs');
              const body = {
                type: 'web',
                name: 'csbaby-sync-server',
                ownerId: '',
                repo: 'https://github.com/forcoder/csBaby',
                branch: 'main',
                autoDeploy: true,
                serviceDetails: {
                  env: 'node',
                  buildCommand: 'cd server && npm install',
                  startCommand: 'cd server && npm start',
                  healthCheckPath: '/',
                  envVars: [
                    { key: 'NODE_ENV', value: 'production' },
                    { key: 'PORT', value: '8080' }
                  ]
                }
              };
              fs.writeFileSync('/tmp/render-create.json', JSON.stringify(body, null, 2));
              console.log('JSON written');
            "

            cat /tmp/render-create.json

            CREATE_RESP=$(curl -s -w "\n%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d @/tmp/render-create.json \
              "https://api.render.com/v1/services")

            CREATE_HTTP=$(echo "$CREATE_RESP" | tail -1)
            echo "HTTP: $CREATE_HTTP"
            echo "$(echo "$CREATE_RESP" | head -n -1)"

            if [ "$CREATE_HTTP" = "201" ]; then
              SERVICE_ID=$(echo "$CREATE_RESP" | head -n -1 | node -e "
                let d=''; process.stdin.on('data',c=>d+=c);
                process.stdin.on('end',()=>{
                  try { const j = JSON.parse(d); console.log(j.service ? j.service.id : j.id); }
                  catch(e) { console.log('PARSE_ERROR'); }
                });
              ")
              echo "Created: $SERVICE_ID"
            else
              echo "Create failed, but service might already exist. Continuing..."
            fi
          fi

          # 3. 触发部署
          if [ -n "$SERVICE_ID" ] && [ "$SERVICE_ID" != "NOT_FOUND" ] && [ "$SERVICE_ID" != "PARSE_ERROR" ]; then
            echo "Deploying $SERVICE_ID..."
            DEPLOY_RESP=$(curl -s -w "\n%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys")

            DEPLOY_HTTP=$(echo "$DEPLOY_RESP" | tail -1)
            echo "Deploy HTTP: $DEPLOY_HTTP"

            if [ "$DEPLOY_HTTP" = "201" ] || [ "$DEPLOY_HTTP" = "200" ] || [ "$DEPLOY_HTTP" = "202" ]; then
              echo "✅ Deploy triggered"
            else
              echo "❌ Deploy failed: $(echo "$DEPLOY_RESP" | head -n -1)"
              exit 1
            fi
          else
            echo "No valid service ID, skipping deploy"
          fi

      - name: Health Check
        run: |
          echo "Waiting for Render..."
          sleep 90
          for i in $(seq 1 8); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 "https://csbaby-sync-server.onrender.com/" 2>/dev/null)
            echo "Attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && echo "✅ Healthy!" && exit 0
            [ $i -lt 8 ] && sleep 30
          done
          echo "⚠️ Not healthy after 4 min"
