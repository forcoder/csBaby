name: Server CI — Build, Test & Deploy

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'app/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'app/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────
  # Job 1: 安装依赖 + Lint + 测试
  # ─────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test

      - name: 语法检查（所有 JS 文件）
        run: |
          for f in src/*.js tests/*.js; do
            [ -f "$f" ] && node --check "$f" && echo "✅ $f"
          done

  # ─────────────────────────────────────────
  # Job 2: 部署到 Render（仅 main/master push）
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Render
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 触发 Render 部署
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -e
          SERVICE_ID="srv-d85hdj3bc2fs73bqqeg0"

          echo "=== 当前版本信息 ==="
          echo "Commit SHA: $GITHUB_SHA"
          echo "Commit message: $(git log -1 --format=%s)"

          echo ""
          echo "=== 服务当前部署状态 ==="
          SERVICE=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SERVICE_ID")
          echo "Service: $SERVICE" | node -e "
            let d=''; process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              const j=JSON.parse(d.replace('Service: ',''));
              console.log('  Name:', j.name);
              console.log('  Branch:', j.branch);
              console.log('  AutoDeploy:', j.autoDeploy);
              console.log('  RootDir:', j.rootDir);
              console.log('  Commit SHA:', j.serviceDetails?.commitSHA || 'not available');
            });
          "

          echo ""
          echo "=== 触发部署 ==="
          DEPLOY=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"clearCache\": false}" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys")

          HTTP=$(echo "$DEPLOY" | tail -1)
          echo "Deploy HTTP: $HTTP"
          echo "Deploy response: $DEPLOY" | head -c 300

          if [ "$HTTP" = "201" ] || [ "$HTTP" = "200" ] || [ "$HTTP" = "202" ]; then
            echo ""
            echo "✅ 部署已触发"
          else
            echo ""
            echo "❌ 部署触发失败"
            exit 1
          fi

      - name: 等待部署完成（健康检查）
        run: |
          echo "等待 90 秒让 Render 完成部署..."
          sleep 90

          for i in $(seq 1 10); do
            RESPONSE=$(curl -s "https://csbaby-sync-server.onrender.com/")
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 10 \
              "https://csbaby-sync-server.onrender.com/" 2>/dev/null)
            echo "Attempt $i: HTTP $CODE"

            # 提取版本号
            VERSION=$(echo "$RESPONSE" | grep -o '"version":"[^"]*"' 2>/dev/null | cut -d'"' -f4)
            echo "  Version: $VERSION"

            if [ "$CODE" = "200" ]; then
              echo "✅ 服务健康！"
              exit 0
            fi

            [ $i -lt 10 ] && sleep 30
          done

          echo "⚠️ 健康检查超时，请检查 Render Dashboard"
          exit 1