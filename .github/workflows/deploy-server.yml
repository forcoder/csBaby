name: Deploy Sync Server to Render

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
  workflow_dispatch:

jobs:
  test:
    name: Test Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: |
          node -e "
          const { register, login } = require('./src/auth');
          (async () => {
            try {
              const r = await register('ci@test.com', 'test123456', 'CI Test');
              console.log('register ok');
              const l = await login('ci@test.com', 'test123456');
              console.log('login ok');
            } catch (e) {
              if (e.message === 'EMAIL_EXISTS') { console.log('user exists, ok'); return; }
              throw e;
            }
          })().catch(e => { console.error('TEST FAILED:', e.message); process.exit(1); });
          "

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Deploy via Render API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -e

          # 1. 查找现有服务
          echo "Listing Render services..."
          SERVICES=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services?limit=50")

          SERVICE_ID=$(echo "$SERVICES" | node -e "
            let d='';
            process.stdin.on('data', c => d += c);
            process.stdin.on('end', () => {
              try {
                const j = JSON.parse(d);
                if (Array.isArray(j)) {
                  // 先找同名服务
                  const byName = j.find(s => s.service.name === 'csbaby-sync-server');
                  if (byName) { console.log(byName.service.id); return; }
                  // 再找 csBaby 仓库的 Node.js 服务
                  const byRepo = j.find(s => s.service.repo === 'https://github.com/forcoder/csBaby' && s.service.type === 'web_service');
                  if (byRepo) { console.log(byRepo.service.id); return; }
                }
                console.log('NOT_FOUND');
              } catch(e) { console.log('NOT_FOUND'); }
            });
          ")

          echo "Found service: $SERVICE_ID"

          # 2. 如果没找到，创建新服务
          if [ "$SERVICE_ID" = "NOT_FOUND" ]; then
            echo "Creating new Render service..."
            CREATE_RESP=$(curl -s -w "\n%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"type":"web_service","name":"csbaby-sync-server","repo":"https://github.com/forcoder/csBaby","branch":"main","autoDeploy":true,"serviceDetails":{"env":"node","buildCommand":"cd server && npm install","startCommand":"cd server && npm start","disk":{"name":"csbaby-data","mountPath":"/opt/render/project/src/server","sizeGB":1}},"envVars":[{"key":"NODE_ENV","value":"production"},{"key":"PORT","value":"8080"}]}' \
              "https://api.render.com/v1/services")

            CREATE_HTTP=$(echo "$CREATE_RESP" | tail -1)
            echo "Create HTTP: $CREATE_HTTP"

            if [ "$CREATE_HTTP" = "201" ]; then
              SERVICE_ID=$(echo "$CREATE_RESP" | head -n -1 | node -e "
                let d=''; process.stdin.on('data',c=>d+=c);
                process.stdin.on('end',()=>{ try{console.log(JSON.parse(d).service.id)}catch(e){console.log('ERROR')} });
              ")
              echo "Created service: $SERVICE_ID"
            else
              echo "Failed to create service"
              echo "$CREATE_RESP"
              exit 1
            fi
          fi

          # 3. 触发部署
          echo "Triggering deploy for $SERVICE_ID..."
          DEPLOY_RESP=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys")

          DEPLOY_HTTP=$(echo "$DEPLOY_RESP" | tail -1)
          DEPLOY_BODY=$(echo "$DEPLOY_RESP" | head -n -1)
          echo "Deploy HTTP: $DEPLOY_HTTP"
          echo "Deploy Response: $DEPLOY_BODY"

          if [ "$DEPLOY_HTTP" = "201" ] || [ "$DEPLOY_HTTP" = "200" ] || [ "$DEPLOY_HTTP" = "202" ]; then
            echo "✅ Deploy triggered"
          else
            echo "❌ Deploy failed"
            exit 1
          fi

      - name: Health Check
        run: |
          echo "Waiting for Render (free tier cold start)..."
          sleep 90
          for i in $(seq 1 6); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 "https://csbaby-sync-server.onrender.com/" 2>/dev/null)
            echo "Attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && echo "✅ Healthy!" && exit 0
            [ $i -lt 6 ] && sleep 30
          done
          echo "⚠️ Not healthy after 4 min"
