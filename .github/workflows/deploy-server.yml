name: Server CI — Build, Test & Deploy

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'app/**'
      - 'admin/**'
      - 'scripts/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────
  # Job 1: Node.js Sync Server 构建测试
  # ─────────────────────────────────────────
  node-build-test:
    name: Node.js Server — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: 运行 Node.js 测试
        run: |
          npm test || true
          for f in src/*.js tests/*.js; do
            [ -f "$f" ] && node --check "$f" && echo "✅ $f" || echo "⚠️  跳过 $f"
          done

  # ─────────────────────────────────────────
  # Job 2: Python Sync Server 构建测试
  # ─────────────────────────────────────────
  python-build-test:
    name: Python Server — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/csBaby-server-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install flask psycopg2-binary PyJWT bcrypt python-dotenv pytest pytest-mock
      - name: 运行 Python sync server 测试
        run: |
          python -m pytest tests/test_knowledge.py tests/test_knowledge_regression.py tests/test_health.py -v --tb=short
      - name: 检查 Python 语法
        run: |
          python -m py_compile app.py
          python -m py_compile controllers/health_controller.py
          python -m py_compile controllers/auth_controller.py
          python -m py_compile controllers/sync_controller.py
          python -m py_compile controllers/backup_controller.py
          python -m py_compile controllers/knowledge_controller.py
          python -m py_compile services/sync_service.py
          python -m py_compile services/backup_service.py
          python -m py_compile services/knowledge_service.py
          python -m py_compile utils/auth.py
          python -m py_compile config/database.py
          echo "✅ 所有 Python 文件编译通过"
      - name: 运行 RDS 迁移脚本测试
        run: |
          python -m pytest ../../scripts/migrate_supabase_to_rds_test.py -v --tb=short

  # ─────────────────────────────────────────
  # Job 3: 部署到 Render
  # ─────────────────────────────────────────
  deploy-render:
    name: Deploy to Render
    needs: [node-build-test, python-build-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 触发 Node.js Sync Server 部署 (render)
        env:
          RENDER_NODE_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_NODE_DEPLOY_HOOK" ]; then
            echo "=== 触发 Node.js Server 部署 ==="
            curl -sSf -w "\nHTTP %{http_code}" -X POST "$RENDER_NODE_DEPLOY_HOOK"
            echo ""
          else
            echo "⚠️ 未设置 RENDER_DEPLOY_HOOK_URL，跳过 Node.js 部署"
          fi

      - name: 触发 Python Sync Server 部署 (render)
        env:
          RENDER_PYTHON_DEPLOY_HOOK: ${{ secrets.RENDER_PYTHON_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_PYTHON_DEPLOY_HOOK" ]; then
            echo "=== 触发 Python Sync Server 部署 ==="
            curl -sSf -w "\nHTTP %{http_code}" -X POST "$RENDER_PYTHON_DEPLOY_HOOK"
            echo ""
          else
            echo "⚠️ 未设置 RENDER_PYTHON_DEPLOY_HOOK，跳过 Python 部署"
          fi

      - name: 等待部署完成并验证
        run: |
          echo "等待 60 秒让 Render 开始构建..."
          sleep 60

          echo "=== 验证 Node.js Server ==="
          for i in $(seq 1 10); do
            VERSION=$(curl -s --max-time 10 "https://csbaby-sync-server.onrender.com/" | \
              grep -o '"version":"[^"]*"' | cut -d'"' -f4 || echo "")
            if [ -n "$VERSION" ] && [ "$VERSION" != "1.0.0" ]; then
              echo "✅ Node.js Server 部署成功: v$VERSION"
              break
            fi
            echo "尝试 $i/10..."
            sleep 15
          done

          echo "=== 验证 Python Sync Server ==="
          for i in $(seq 1 10); do
            STATUS=$(curl -s --max-time 10 "https://csbaby-sync-server-py.onrender.com/health" | \
              grep -o '"status":"[^"]*"' | cut -d'"' -f4 || echo "")
            if [ "$STATUS" = "ok" ]; then
              echo "✅ Python Sync Server 部署成功"
              break
            fi
            echo "尝试 $i/10..."
            sleep 15
          done

          echo "=== 部署验证完成 ==="
