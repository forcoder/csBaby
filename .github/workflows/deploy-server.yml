name: Server CI — Build, Test & Deploy

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'app/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: for f in src/*.js tests/*.js; do [ -f "$f" ] && node --check "$f" && echo "✅ $f"; done

  deploy:
    name: Deploy to Render
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 触发 Render 部署
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "=== 触发 Render 部署 ==="
          echo "Commit: $GITHUB_SHA"

          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "使用 deploy hook..."
            HOOK_RESP=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
            HOOK_CODE=$(echo "$HOOK_RESP" | tail -1)
            echo "Deploy hook HTTP: $HOOK_CODE"
          fi

          echo "等待 300 秒让 Render 完成构建..."
          sleep 300

          for i in $(seq 1 20); do
            VERSION=$(curl -s "https://csbaby-sync-server.onrender.com/" | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
            echo "Attempt $i: VERSION=$VERSION"
            if [ -n "$VERSION" ] && [ "$VERSION" != "1.0.0" ]; then
              echo "✅ 部署成功！新版本: $VERSION"
              exit 0
            fi
            sleep 30
          done

          echo "⚠️ 部署验证失败"
          exit 1
