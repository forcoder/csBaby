name: Server CI — Build, Test & Deploy

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'app/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'app/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────
  # Job 1: 安装依赖 + Lint + 测试
  # ─────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test

      - name: 语法检查（所有 JS 文件）
        run: |
          for f in src/*.js tests/*.js; do
            [ -f "$f" ] && node --check "$f" && echo "✅ $f"
          done

  # ─────────────────────────────────────────
  # Job 2: 部署到 Render（仅 main/master push）
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Render
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 触发 Render 部署（使用 Deploy Hook）
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "=== 使用 Deploy Hook 触发部署 ==="

          # 触发部署（Deploy Hook 会等待部署完成）
          HOOK_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")

          HTTP=$(echo "$HOOK_RESPONSE" | tail -1)
          BODY=$(echo "$HOOK_RESPONSE" | head -c 500)

          echo "Hook HTTP: $HTTP"
          echo "Hook Response: $BODY"

          if [ "$HTTP" = "200" ]; then
            echo "✅ Deploy Hook 成功触发"
          else
            echo "❌ Deploy Hook 失败"
            exit 1
          fi

      - name: 等待服务启动
        run: |
          echo "等待 120 秒让服务启动..."
          sleep 120

          for i in $(seq 1 10); do
            RESPONSE=$(curl -s "https://csbaby-sync-server.onrender.com/")
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 10 \
              "https://csbaby-sync-server.onrender.com/" 2>/dev/null)

            VERSION=$(echo "$RESPONSE" | grep -o '"version":"[^"]*"' 2>/dev/null | cut -d'"' -f4)
            echo "Attempt $i: HTTP $CODE, Version: $VERSION"

            if [ "$CODE" = "200" ] && [ -n "$VERSION" ]; then
              echo "✅ 服务健康！"
              exit 0
            fi

            [ $i -lt 10 ] && sleep 20
          done

          echo "⚠️ 健康检查失败"
          exit 1