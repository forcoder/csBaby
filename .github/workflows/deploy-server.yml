name: Server CI — Build, Test & Deploy

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'app/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'app/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────
  # Job 1: 安装依赖 + Lint + 测试
  # ─────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test

      - name: 语法检查（所有 JS 文件）
        run: |
          for f in src/*.js tests/*.js; do
            [ -f "$f" ] && node --check "$f" && echo "✅ $f"
          done

  # ─────────────────────────────────────────
  # Job 2: 部署到 Render（仅 main/master push）
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Render
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 触发 Render 部署并等待完成
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          SERVICE_ID="srv-d85hdj3bc2fs73bqqeg0"
          EXPECTED_COMMIT="$GITHUB_SHA"

          echo "=== 触发部署 ==="
          echo "Commit SHA: $EXPECTED_COMMIT"

          # 触发部署
          DEPLOY=$(curl -s -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys")

          echo "Deploy response: $DEPLOY"

          # 提取 deploy ID
          DEPLOY_ID=$(echo "$DEPLOY" | node -e "
            let d=''; process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try {
                const j=JSON.parse(d);
                console.log(j.id);
              } catch(e) {console.log('');}
            });
          ")

          echo "Deploy ID: $DEPLOY_ID"

          if [ -z "$DEPLOY_ID" ]; then
            echo "❌ 无法获取 Deploy ID"
            exit 1
          fi

          echo ""
          echo "=== 等待部署完成 ==="

          # 轮询部署状态，最多等待 5 分钟
          MAX_WAIT=300
          ELAPSED=0
          INTERVAL=15

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))

            # 获取部署状态
            DEPLOY_STATUS=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/deploys/$DEPLOY_ID")

            STATUS=$(echo "$DEPLOY_STATUS" | node -e "
              let d=''; process.stdin.on('data',c=>d+=c);
              process.stdin.on('end',()=>{
                try {
                  const j=JSON.parse(d);
                  console.log(j.status);
                } catch(e) {console.log('unknown');}
              });
            ")

            echo "Status at ${ELAPSED}s: $STATUS"

            if [ "$STATUS" = "live" ]; then
              echo ""
              echo "✅ 部署已完成！"
              break
            elif [ "$STATUS" = "failed" ]; then
              echo ""
              echo "❌ 部署失败"
              exit 1
            fi
          done

          if [ "$STATUS" != "live" ]; then
            echo ""
            echo "⚠️ 部署超时"
            exit 1
          fi

      - name: 验证部署
        run: |
          echo "验证新版本..."

          for i in $(seq 1 10); do
            RESPONSE=$(curl -s "https://csbaby-sync-server.onrender.com/")
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 10 \
              "https://csbaby-sync-server.onrender.com/" 2>/dev/null)

            # 提取版本号
            VERSION=$(echo "$RESPONSE" | grep -o '"version":"[^"]*"' 2>/dev/null | cut -d'"' -f4)
            echo "Attempt $i: HTTP $CODE, Version: $VERSION"

            if [ "$CODE" = "200" ]; then
              echo "✅ 服务健康！"
              exit 0
            fi

            [ $i -lt 10 ] && sleep 15
          done

          echo "⚠️ 健康检查失败"
          exit 1