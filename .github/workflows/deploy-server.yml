name: Deploy Sync Server to Render

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
  workflow_dispatch:

jobs:
  test:
    name: Test Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: |
          node -e "
          const { register, login } = require('./src/auth');
          (async () => {
            try {
              const r = await register('ci@test.com', 'test123456', 'CI Test');
              console.log('register ok');
              const l = await login('ci@test.com', 'test123456');
              console.log('login ok');
            } catch (e) {
              if (e.message === 'EMAIL_EXISTS') { console.log('user exists, ok'); return; }
              throw e;
            }
          })().catch(e => { console.error('TEST FAILED:', e.message); process.exit(1); });
          "

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via Render Deploy Hook
        run: |
          echo "Triggering Render deploy via Deploy Hook..."

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}' \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")

          echo "Deploy Hook HTTP: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "202" ] || [ "$HTTP_CODE" = "204" ]; then
            echo "✅ Deploy triggered via hook"
          else
            echo "⚠️ Deploy hook returned HTTP $HTTP_CODE"
          fi

      - name: Wait and Health Check
        run: |
          echo "Waiting for Render deployment (free tier cold start)..."
          sleep 60

          for i in $(seq 1 8); do
            echo "Health check attempt $i..."
            HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" \
              --connect-timeout 10 \
              "https://csbaby-sync-server.onrender.com/" 2>/dev/null)
            BODY=$(cat /tmp/health.json 2>/dev/null)
            echo "HTTP: $HTTP_CODE | Body: $BODY"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Service is healthy!"
              exit 0
            fi

            [ $i -lt 8 ] && sleep 30
          done

          echo "⚠️ Service not healthy after 4 min. Render Dashboard may have more info."
