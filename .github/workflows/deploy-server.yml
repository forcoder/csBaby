name: Deploy Sync Server to Render

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
  workflow_dispatch:

jobs:
  test:
    name: Test Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: |
          node -e "
          const { register, login } = require('./src/auth');
          (async () => {
            try {
              const r = await register('ci@test.com', 'test123456', 'CI Test');
              console.log('register ok');
              const l = await login('ci@test.com', 'test123456');
              console.log('login ok');
            } catch (e) {
              if (e.message === 'EMAIL_EXISTS') { console.log('user exists, ok'); return; }
              throw e;
            }
          })().catch(e => { console.error('TEST FAILED:', e.message); process.exit(1); });
          "

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Trigger Render Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          SERVICE_ID="srv-d7s88gbeo5us73cga3d0"
          echo "Triggering deploy for service: $SERVICE_ID"

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "✅ Deploy triggered successfully"
          else
            echo "❌ Deploy failed with HTTP $HTTP_CODE"
            exit 1
          fi
