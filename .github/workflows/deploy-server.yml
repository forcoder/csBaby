name: Server CI — Build, Test & Deploy

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'app/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'app/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────
  # Job 1: 安装依赖 + Lint + 测试
  # ─────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test

      - name: 语法检查（所有 JS 文件）
        run: |
          for f in src/*.js tests/*.js; do
            [ -f "$f" ] && node --check "$f" && echo "✅ $f"
          done

  # ─────────────────────────────────────────
  # Job 2: 部署到 Render（仅 main/master push）
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Render
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查并启用 Auto-Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          SERVICE_ID="srv-d85hdj3bc2fs73bqqeg0"

          echo "检查服务信息..."
          SERVICE=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SERVICE_ID")

          echo "服务响应: $SERVICE"

          # 启用 auto-deploy
          echo "启用 auto-deploy for main branch..."
          PATCH_RESULT=$(curl -s -w "\n%{http_code}" -X PATCH \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"autoDeployEnabled": true, "branch": "main"}' \
            "https://api.render.com/v1/services/$SERVICE_ID")

          echo "PATCH result: $PATCH_RESULT"

      - name: 触发 Render 部署（使用 Deploy Hook）
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "使用 Deploy Hook 触发部署..."
          HOOK_TEST=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          HTTP=$(echo "$HOOK_TEST" | tail -1)
          echo "Hook Response HTTP: $HTTP"
          echo "Hook Response body: $HOOK_TEST"

          if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ] || [ "$HTTP" = "202" ]; then
            echo "✅ Deploy Hook 触发成功"
          else
            echo "❌ Deploy Hook 触发失败"
            exit 1
          fi

      - name: 等待部署完成（健康检查）
        run: |
          echo "等待 60 秒让 Render 完成部署..."
          sleep 60

          for i in $(seq 1 8); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 10 \
              "https://csbaby-sync-server.onrender.com/" 2>/dev/null)
            echo "Attempt $i: HTTP $CODE"

            if [ "$CODE" = "200" ]; then
              echo "✅ 服务健康！"
              exit 0
            fi

            [ $i -lt 8 ] && sleep 30
          done

          echo "⚠️ 健康检查超时，请检查 Render Dashboard"
          exit 1