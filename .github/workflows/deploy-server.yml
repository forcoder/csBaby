name: Deploy Sync Server to Render

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          node -e "
          const { register, login } = require('./src/auth');
          (async () => {
            try {
              const r = await register('ci@test.com', 'test123456', 'CI Test');
              console.log('register ok:', r.userId.substring(0,8));
              const l = await login('ci@test.com', 'test123456');
              console.log('login ok:', l.userId.substring(0,8));
              const { queryAll } = require('./src/db');
              const rules = queryAll('SELECT * FROM keyword_rules WHERE tenant_id=?', [l.tenantId]);
              console.log('db query ok:', rules.length, 'rules');
            } catch (e) {
              if (e.message === 'EMAIL_EXISTS') { console.log('user exists, skipping'); return; }
              throw e;
            }
          })().catch(e => { console.error('TEST FAILED:', e.message); process.exit(1); });
          "

      - name: Deploy to Render
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}' || echo "Deploy hook not configured, skipping"
