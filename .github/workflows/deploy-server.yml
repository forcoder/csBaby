name: Server CI — Build, Test & Deploy

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'app/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'app/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────
  # Job 1: 安装依赖 + Lint + 测试
  # ─────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test

      - name: 语法检查（所有 JS 文件）
        run: |
          for f in src/*.js tests/*.js; do
            [ -f "$f" ] && node --check "$f" && echo "✅ $f"
          done

  # ─────────────────────────────────────────
  # Job 2: 部署到 Render（仅 main/master push）
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Render
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 触发 Render 部署
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -e

          # 1. 获取已有服务列表
          SERVICES=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services?limit=50")

          # 2. 查找 csbaby-sync-server
          SERVICE_ID=$(echo "$SERVICES" | node -e "
            let d=''; process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try {
                const j=JSON.parse(d);
                if(Array.isArray(j)){
                  const svc=j.find(s=>s.service.name==='csbaby-sync-server');
                  if(svc){console.log(svc.service.id);return;}
                }
                console.log('NOT_FOUND');
              } catch(e){console.log('NOT_FOUND');}
            });
          ")

          if [ "$SERVICE_ID" = "NOT_FOUND" ]; then
            echo "服务不存在，首次部署需要手动在 Render 创建服务"
            echo "或使用 workflow_dispatch 触发带创建逻辑的部署"
            exit 1
          fi

          echo "Service ID: $SERVICE_ID"
          echo "Service ID length: ${#SERVICE_ID}"

          # 打印所有服务名用于调试
          echo "=== 所有服务 ==="
          echo "$SERVICES" | node -e "
            let d=''; process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try {
                const j=JSON.parse(d);
                if(Array.isArray(j)){
                  j.forEach(s=>console.log('-',s.service.name,'->',s.service.id));
                }
              } catch(e){console.log('Parse error:',e.message)}
            });
          "

          # 3. 清理 Render 缓存并触发重新部署
          echo "触发强制重新部署..."
          DEPLOY=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys")

          HTTP=$(echo "$DEPLOY" | tail -1)
          echo "Deploy HTTP: $HTTP"

          [ "$HTTP" = "201" ] || [ "$HTTP" = "200" ] || [ "$HTTP" = "202" ] \
            && echo "✅ 部署已触发" || { echo "❌ 部署触发失败"; exit 1; }

      - name: 等待部署完成（健康检查）
        run: |
          echo "等待 60 秒让 Render 完成部署..."
          sleep 60

          for i in $(seq 1 8); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 10 \
              "https://csbaby-sync-server.onrender.com/" 2>/dev/null)
            echo "Attempt $i: HTTP $CODE"

            if [ "$CODE" = "200" ]; then
              echo "✅ 服务健康！"
              exit 0
            fi

            [ $i -lt 8 ] && sleep 30
          done

          echo "⚠️ 健康检查超时，请检查 Render Dashboard"
          exit 1
