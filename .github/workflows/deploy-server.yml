name: Deploy Sync Server to Render

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
  workflow_dispatch:

jobs:
  test:
    name: Test Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: |
          node -e "
          const { register, login } = require('./src/auth');
          (async () => {
            try {
              const r = await register('ci@test.com', 'test123456', 'CI Test');
              console.log('register ok');
              const l = await login('ci@test.com', 'test123456');
              console.log('login ok');
            } catch (e) {
              if (e.message === 'EMAIL_EXISTS') { console.log('user exists, ok'); return; }
              throw e;
            }
          })().catch(e => { console.error('TEST FAILED:', e.message); process.exit(1); });
          "

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Create Service & Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -e

          # 1. 获取 ownerId（从现有服务中提取）
          SERVICES=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services?limit=50")
          OWNER_ID=$(echo "$SERVICES" | node -e "
            let d=''; process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try {
                const j = JSON.parse(d);
                if (Array.isArray(j) && j.length > 0) {
                  console.log(j[0].service.ownerId || j[0].service.owner || '');
                }
              } catch(e) { console.log(''); }
            });
          ")
          echo "Owner ID: $OWNER_ID"

          # 2. 检查服务是否已存在
          SERVICE_ID=$(echo "$SERVICES" | node -e "
            let d=''; process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try {
                const j = JSON.parse(d);
                if (Array.isArray(j)) {
                  const svc = j.find(s => s.service.name === 'csbaby-sync-server');
                  if (svc) { console.log(svc.service.id); return; }
                }
                console.log('NOT_FOUND');
              } catch(e) { console.log('NOT_FOUND'); }
            });
          ")
          echo "Service: $SERVICE_ID"

          # 3. 如果没找到，创建新服务
          if [ "$SERVICE_ID" = "NOT_FOUND" ]; then
            echo "Creating service..."
            node -e "
              const https = require('https');
              const body = JSON.stringify({
                type: 'web_service',
                name: 'csbaby-sync-server',
                ownerId: '$OWNER_ID',
                repo: 'https://github.com/forcoder/csBaby',
                branch: 'main',
                autoDeploy: 'yes',
                env: 'node',
                buildCommand: 'cd server && npm install',
                startCommand: 'cd server && npm start'
              });
              const options = {
                hostname: 'api.render.com',
                path: '/v1/services',
                method: 'POST',
                headers: {
                  'Authorization': 'Bearer ' + process.env.RENDER_API_KEY,
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(body)
                }
              };
              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => {
                  console.log('HTTP:', res.statusCode);
                  console.log('Body:', data);
                  if (res.statusCode === 201) {
                    try {
                      const j = JSON.parse(data);
                      const id = j.service ? j.service.id : j.id;
                      console.log('SERVICE_ID=' + id);
                    } catch(e) { console.log('PARSE_ERROR'); }
                  }
                });
              });
              req.on('error', e => { console.error('ERROR:', e.message); process.exit(1); });
              req.write(body);
              req.end();
            " > /tmp/render-result.txt 2>&1

            cat /tmp/render-result.txt
            SERVICE_ID=$(grep "SERVICE_ID=" /tmp/render-result.txt 2>/dev/null | cut -d= -f2)
            echo "Created: $SERVICE_ID"
          fi

          # 4. 触发部署
          if [ -n "$SERVICE_ID" ] && [ "$SERVICE_ID" != "NOT_FOUND" ] && [ -n "$OWNER_ID" ]; then
            echo "Deploying $SERVICE_ID..."
            DEPLOY_RESP=$(curl -s -w "\n%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys")
            HTTP=$(echo "$DEPLOY_RESP" | tail -1)
            echo "Deploy HTTP: $HTTP"
            echo "$(echo "$DEPLOY_RESP" | head -n -1)"
            [ "$HTTP" = "201" ] || [ "$HTTP" = "200" ] || [ "$HTTP" = "202" ] && echo "✅ Deploy triggered" || exit 1
          else
            echo "Skipping deploy (no service ID or owner ID)"
          fi
