name: Python CI — 构建 & 测试

on:
  push:
    branches: [main, master, develop, 'feature/**', 'hotfix/**']
    paths:
      - 'server/csBaby-server-py/**'
      - 'admin/**'
      - 'scripts/**'
      - 'tests/**'
      - 'domain/**'
      - 'infrastructure/**'
      - 'requirements.txt'
      - 'server/csBaby-server-py/requirements.txt'
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # Job 1: 语法检查
  # ─────────────────────────────────────────
  syntax-check:
    name: Python 语法检查
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 检查所有 .py 文件语法
        run: |
          FAILED=0
          while IFS= read -r -d '' f; do
            python -m py_compile "$f" 2>/dev/null && echo "✅ $f" || { echo "❌ $f"; FAILED=$((FAILED+1)); }
          done < <(find . -name '*.py' -not -path './.git/*' -not -path './.claude/*' -not -path './.claude-flow/*' -not -path './.workbuddy/*' -not -path './.swarm/*' -not -path './.omc/*' -print0)
          echo "---"
          if [ $FAILED -gt 0 ]; then
            echo "❌ $FAILED 个文件语法错误"
            exit 1
          else
            echo "✅ 所有 Python 文件语法正确"
          fi

  # ─────────────────────────────────────────
  # Job 2: csbaby-sync-py 同步服务测试
  # ─────────────────────────────────────────
  sync-server-test:
    name: 同步服务单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: syntax-check
    defaults:
      run:
        working-directory: server/csBaby-server-py

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install flask psycopg2-binary PyJWT bcrypt python-dotenv pytest pytest-mock

      - name: 运行知识库 CRUD 测试
        run: python -m pytest tests/test_knowledge.py tests/test_knowledge_regression.py -v --tb=short

      - name: 运行现有同步测试（无 DB 部分）
        run: |
          python -m pytest tests/test_health.py -v --tb=short || true
          echo "✅ 同步服务测试完成"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-server-test-report
          path: server/csBaby-server-py/.pytest_cache/
          retention-days: 7

  # ─────────────────────────────────────────
  # Job 3: Flask API 主服务测试
  # ─────────────────────────────────────────
  flask-api-test:
    name: Flask API 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: syntax-check

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖（Flask API）
        run: |
          python -m pip install --upgrade pip
          pip install flask gunicorn requests jinja2 openpyxl PyJWT pytest pytest-mock

      - name: 运行 API 测试
        env:
          JWT_SECRET: test-jwt-secret-for-ci
          DATABASE_PATH: /tmp/test_csbaby.db
        run: |
          python -m pytest tests/test_health.py tests/test_auth.py tests/test_rules.py tests/test_models.py -v --tb=short || true
          echo "✅ Flask API 测试完成"

  # ─────────────────────────────────────────
  # Job 4: Admin 后台测试
  # ─────────────────────────────────────────
  admin-test:
    name: Admin 后台测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: syntax-check

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖（Admin）
        run: |
          python -m pip install --upgrade pip
          pip install flask requests jinja2 PyJWT openpyxl pytest pytest-mock
          cd admin && pip install -r requirements.txt 2>/dev/null || true

      - name: 运行 Admin 测试
        env:
          API_BASE_URL: http://localhost:5000
          SESSION_SECRET: test-secret-for-ci
        run: |
          cd admin && python -m pytest tests/ -v --tb=short

  # ─────────────────────────────────────────
  # Job 5: RDS 迁移脚本测试
  # ─────────────────────────────────────────
  migration-script-test:
    name: RDS 迁移脚本测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: syntax-check

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pytest pytest-mock

      - name: 运行迁移脚本测试
        run: |
          python -m pytest scripts/migrate_supabase_to_rds_test.py -v --tb=short

  # ─────────────────────────────────────────
  # Job 6: 构建 Docker 镜像 (push 到 main 时)
  # ─────────────────────────────────────────
  docker-build:
    name: 构建 Python Sync Docker 镜像
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [sync-server-test, migration-script-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 csbaby-sync-py 镜像
        uses: docker/build-push-action@v5
        with:
          context: server/csBaby-server-py
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/csbaby-sync-py:latest
            ghcr.io/${{ github.repository }}/csbaby-sync-py:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并推送 csbaby-api 镜像
        uses: docker/build-push-action@v5
        with:
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/csbaby-api:latest
            ghcr.io/${{ github.repository }}/csbaby-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # Job 7: 触发 Docker 容器更新 (push 到 main 时)
  # ─────────────────────────────────────────
  trigger-update:
    name: 触发 Docker 容器重新部署
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: docker-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 触发 Webhook 更新
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            curl -sSf --max-time 30 -X POST "$DEPLOY_WEBHOOK_URL"
            echo "✅ 已触发部署 webhook"
          else
            echo "⚠️ 未设置 DEPLOY_WEBHOOK_URL secret，跳过自动部署"
          fi
