name: Release - 上传到 shz.al

on:
  # 打 tag 时自动触发（如 v1.1.70）
  push:
    tags:
      - 'v*.*.*'
  # 也可以手动触发
  workflow_dispatch:
    inputs:
      expire_days:
        description: '文件有效期（如 7d / 30d / 永久留空）'
        required: false
        default: '7d'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # Release 不允许并发取消

jobs:
  # ─────────────────────────────────────────
  # Job 1: 构建 Release APK
  # ─────────────────────────────────────────
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
      apk_path:     ${{ steps.rename.outputs.apk_path }}
      apk_name:     ${{ steps.rename.outputs.apk_name }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
          cache: gradle

      - name: 设置 Android SDK（用于 apksigner / zipalign）
        uses: android-actions/setup-android@v2
        with:
          # compileSdk=34 (见 app/build.gradle.kts),build-tools 34.0.0 自带 apksigner
          api-level: '34'
          build-tools-version: '34.0.0'

      - name: 授权 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 读取版本信息
        id: version
        run: |
          VERSION_CODE=$(grep 'APP_VERSION_CODE' gradle.properties | cut -d'=' -f2)
          VERSION_NAME=$(grep 'APP_VERSION_NAME' gradle.properties | cut -d'=' -f2)
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "📦 构建版本: v$VERSION_NAME ($VERSION_CODE)"

      - name: 构建 Release APK（未签名）
        run: |
          ./gradlew assembleRelease --no-daemon -PskipVersionIncrement -PskipUpload \
            --stacktrace

      - name: 生成临时签名 keystore（不入仓，CI 销毁）
        run: |
          mkdir -p /tmp/keystore
          KEYSTORE_PATH=/tmp/keystore/release.jks
          # 从 secrets 读别名和密码; keystore 仅在 CI 临时目录存在,
          # 构建完成后随 runner 销毁, 不会泄露到任何外部存储。
          KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
          KEYSTORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          # 调试输出（不打印密码值）: 长度而非内容
          echo "::group::Secrets 调试（不显示值，仅长度）"
          echo "  KEY_ALIAS length=${#KEY_ALIAS}  (expected > 0)"
          echo "  KEYSTORE_PASS length=${#KEYSTORE_PASS}  (expected >= 4)"
          echo "  KEY_PASS length=${#KEY_PASS}  (expected >= 4)"
          echo "::endgroup::"
          if [ -z "$KEY_ALIAS" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::缺少签名 secrets: KEY_ALIAS / KEYSTORE_PASSWORD / KEY_PASSWORD 必须在仓库 Settings → Secrets → Actions 中配置"
            echo "::error::当前值: KEY_ALIAS='${KEY_ALIAS}' KEYSTORE_PASS len=${#KEYSTORE_PASS} KEY_PASS len=${#KEY_PASS}"
            exit 1
          fi
          # keytool 来自本 job 前面 setup-java@v4 安装的 JDK 17
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=csBaby Release, OU=Mobile, O=csBaby, L=NA, S=NA, C=CN" 2>&1 | tee /tmp/keytool.log
          KEYTOOL_EXIT=$?
          if [ $KEYTOOL_EXIT -ne 0 ]; then
            echo "::error::keytool 退出码: $KEYTOOL_EXIT"
            cat /tmp/keytool.log
            exit $KEYTOOL_EXIT
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS"     >> $GITHUB_ENV
          ls -la "$KEYSTORE_PATH"
          echo "OK: keystore generated at $KEYSTORE_PATH"

      - name: 用 apksigner 给 APK 签名 + 校验
        run: |
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="app/build/outputs/apk/release/app-release.apk"
          # zipalign 是 v2/v3 签名块对齐的强制要求
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -v -p 4 "$UNSIGNED" "${UNSIGNED}.aligned"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$SIGNED" \
            "${UNSIGNED}.aligned"
          # 校验签名确实生效(否则上传后还是未签名)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$SIGNED"
          echo "OK: APK signed at $SIGNED"

      - name: 重命名并记录 APK 路径
        id: rename
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_NAME="csBaby-v${{ steps.version.outputs.name }}.apk"
          APK_DST="app/build/outputs/apk/release/$APK_NAME"
          mv "$APK_SRC" "$APK_DST"
          echo "apk_path=$APK_DST" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME"  >> $GITHUB_OUTPUT
          echo "APK_SIZE=$(du -sh $APK_DST | cut -f1)" >> $GITHUB_ENV

      - name: 上传 APK Artifact（供后续 Job 使用）
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.rename.outputs.apk_path }}
          retention-days: 30

  # ─────────────────────────────────────────
  # Job 2: 上传到 shz.al
  # ─────────────────────────────────────────
  upload-shzal:
    name: Deploy to shz.al
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-release
    environment: production   # 需要在 GitHub Settings → Environments 配置审批

    steps:
      - name: 检出代码（读取 gradle.properties）
        uses: actions/checkout@v4

      - name: 下载 APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./apk-output

      - name: 获取 APK 真实路径
        id: apk
        run: |
          APK_FILE=$(find ./apk-output -name "*.apk" | head -1)
          echo "path=$APK_FILE" >> $GITHUB_OUTPUT
          echo "✅ APK: $APK_FILE"

      - name: 计算 MD5
        id: md5
        run: |
          MD5=$(md5sum "${{ steps.apk.outputs.path }}" | awk '{print $1}')
          SIZE=$(stat -c%s "${{ steps.apk.outputs.path }}")
          echo "md5=$MD5"   >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: 生成 version-info.json
        run: |
          EXPIRE="${{ inputs.expire_days || '7d' }}"
          cat > version-info.json << EOF
          {
            "versionCode": ${{ needs.build-release.outputs.version_code }},
            "versionName": "${{ needs.build-release.outputs.version_name }}",
            "releaseDate": "$(date +%Y-%m-%d)",
            "fileSize": ${{ steps.md5.outputs.size }},
            "md5": "${{ steps.md5.outputs.md5 }}",
            "downloadUrl": "https://shz.al/~csBabyApk",
            "releaseNotes": "v${{ needs.build-release.outputs.version_name }} 更新",
            "forceUpdate": false
          }
          EOF
          cat version-info.json

      - name: 上传版本信息到 shz.al
        env:
          SHZAL_PASSWORD: ${{ secrets.SHZAL_PASSWORD }}
        run: |
          EXPIRE="${{ inputs.expire_days || '7d' }}"
          # 先删除旧文件
          curl -s -X DELETE "https://shz.al/~csBabyLog:${SHZAL_PASSWORD}" || true
          # 上传新版本信息
          RESP=$(curl -s -X POST \
            -F "n=csBabyLog" \
            -F "e=${EXPIRE}" \
            -F "c=@version-info.json" \
            -F "s=${SHZAL_PASSWORD}" \
            https://shz.al)
          echo "版本信息上传响应: $RESP"
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print('✅ 版本信息已上传:', d.get('url',''))"

      - name: 上传 APK 到 shz.al
        env:
          SHZAL_PASSWORD: ${{ secrets.SHZAL_PASSWORD }}
        run: |
          EXPIRE="${{ inputs.expire_days || '7d' }}"
          # 先删除旧 APK
          curl -s -X DELETE "https://shz.al/~csBabyApk:${SHZAL_PASSWORD}" || true
          # 上传新 APK
          RESP=$(curl -s -X POST \
            -F "n=csBabyApk" \
            -F "e=${EXPIRE}" \
            -F "filename=${{ needs.build-release.outputs.apk_name }}" \
            -F "c=@${{ steps.apk.outputs.path }}" \
            -F "s=${SHZAL_PASSWORD}" \
            https://shz.al)
          echo "APK 上传响应: $RESP"
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print('✅ APK 已上传:', d.get('url',''))"

      - name: 输出部署摘要
        run: |
          echo "## 🚀 部署完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 字段 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 版本 | v${{ needs.build-release.outputs.version_name }} (${{ needs.build-release.outputs.version_code }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| APK | ${{ needs.build-release.outputs.apk_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MD5 | ${{ steps.md5.outputs.md5 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 版本信息 | https://shz.al/~csBabyLog |" >> $GITHUB_STEP_SUMMARY
          echo "| APK 下载 | https://shz.al/~csBabyApk |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────
  # Job 3: 创建 GitHub Release（打 tag 时触发）
  # ─────────────────────────────────────────
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ build-release, upload-shzal ]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 下载 APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./apk-output

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "客服小秘 v${{ needs.build-release.outputs.version_name }}"
          body: |
            ## 📦 客服小秘 v${{ needs.build-release.outputs.version_name }}

            **版本号：** ${{ needs.build-release.outputs.version_code }}
            **发布日期：** $(date +%Y-%m-%d)

            ### 下载
            - 📥 **直接下载（7天有效）：** https://shz.al/~csBabyApk
            - 📋 **版本信息：** https://shz.al/~csBabyLog

            ### 变更内容
            > 请在此补充本版本的主要变更

          files: ./apk-output/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
