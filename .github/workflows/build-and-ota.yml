name: Build and OTA Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-ota:
    name: Build APK and Upload to shz.al
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Clean build cache
        run: ./gradlew clean --no-daemon
        continue-on-error: true

      - name: Cache Gradle artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Read current version
        id: version
        run: |
          VERSION_CODE=$(grep 'APP_VERSION_CODE' gradle.properties | cut -d'=' -f2)
          VERSION_NAME=$(grep 'APP_VERSION_NAME' gradle.properties | cut -d'=' -f2)
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "📦 Current version: v$VERSION_NAME ($VERSION_CODE)"

      # 从 GitHub Secrets 还原 release keystore（p12）到工作目录
      # 必须在 Build 之前完成, build.gradle.kts 通过 KS_FILE 环境变量读取
      - name: Restore release keystore
        env:
          KS_BASE64:  ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS:    ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS:   ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KS_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is empty. 请在 GitHub Settings → Secrets 配置."
            exit 1
          fi
          mkdir -p keystore
          echo "$KS_BASE64" | base64 -d > keystore/csBaby-release.p12
          ls -la keystore/

      # 修改 build.yml OTA 步骤所在 - 通过环境变量让 Gradle 使用 release 签名
      # 这里把 keystore 路径和密码导出给后续 gradle step 使用
      - name: Build Release APK (用 release keystore 签名)
        env:
          KS_FILE:       ${{ github.workspace }}/keystore/csBaby-release.p12
          KS_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_KEY_ALIAS:  ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS:   ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          # 确认输出文件确实是 signed release apk 而不是 unsigned
          RELEASE_APK="$(ls app/build/outputs/apk/release/app-release.apk 2>/dev/null || echo '')"
          UNSIGNED_APK="$(ls app/build/outputs/apk/release/app-release-unsigned.apk 2>/dev/null || echo '')"
          if [ -z "$RELEASE_APK" ] || [ -n "$UNSIGNED_APK" ]; then
            echo "::error::未找到已签名 release APK. 当前 outputs:"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          echo "✅ Signed APK: $RELEASE_APK"
          APK_SIZE=$(stat -c%s "$RELEASE_APK")
          echo "APK_SIZE_BYTES=$APK_SIZE"

      - name: Rename APK
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_DST="app/build/outputs/apk/release/csBaby-v${{ steps.version.outputs.name }}-release.apk"
          mv "$APK_SRC" "$APK_DST"
          echo "APK_PATH=$APK_DST" >> $GITHUB_ENV
          echo "APK_NAME=csBaby-v${{ steps.version.outputs.name }}-release.apk" >> $GITHUB_ENV

      - name: Upload APK to shz.al
        env:
          SHZAL_PASSWORD: ${{ secrets.SHZAL_PASSWORD }}
        run: |
          APK_PATH="${{ env.APK_PATH }}"
          APK_NAME="${{ env.APK_NAME }}"
          VERSION_CODE="${{ steps.version.outputs.code }}"
          VERSION_NAME="${{ steps.version.outputs.name }}"
          RELEASE_DATE="$(date +%Y-%m-%d)"

          # Get APK info
          APK_SIZE=$(stat -c%s "$APK_PATH")
          APK_MD5=$(md5sum "$APK_PATH" | cut -d' ' -f1)

          # Create version info JSON
          # downloadUrl 指向版本专用文件，客户端应该读取 csBabyLog_v{VERSION_CODE} 获取最新版本信息
          # 注意: heredoc 不能用 'EOF' (单引号会阻止变量展开), 否则 shz.al 上存的是字面模板
          cat > /tmp/version.json << VERSION_EOF
          {"versionCode":${VERSION_CODE},"versionName":"${VERSION_NAME}","releaseDate":"${RELEASE_DATE}","fileSize":${APK_SIZE},"md5":"${APK_MD5}","downloadUrl":"https://shz.al/~csBabyApk_v${VERSION_CODE}","releaseNotes":"v${VERSION_NAME} 更新(已签名 release)","forceUpdate":false}
          VERSION_EOF

          # 上传顺序很关键: 先 version-info, 再 APK. 客户端读 ~csBabyLog 拿到主更新指针,
          # ~csBabyLog_v{VERSION_CODE} 是 fallback. 这里 3 个都必须更新(否则老客户端读不到)
          echo "[1/3] Uploading master csBabyLog (客户端首先读这个)..."
          curl -s -X POST -F "n=csBabyLog" -F "c=@/tmp/version.json" -F "e=30d" https://shz.al

          echo "[2/3] Uploading version info (csBabyLog_v${VERSION_CODE})..."
          curl -s -X POST -F "n=csBabyLog_v${VERSION_CODE}" -F "c=@/tmp/version.json" -F "e=30d" https://shz.al

          echo "[3/3] Uploading APK (csBabyApk_v${VERSION_CODE})..."
          curl -s -X POST -F "n=csBabyApk_v${VERSION_CODE}" -F "filename=$APK_NAME" -F "c=@$APK_PATH" -F "e=30d" https://shz.al

      - name: Output APK download URL
        run: |
          echo "## 🎉 Build and OTA deploy successful (signed release APK)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | v${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| APK File | ${{ env.APK_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Signed | YES (release keystore) |" >> $GITHUB_STEP_SUMMARY
          echo "| Download URL | https://shz.al/~csBabyApk_v${{ steps.version.outputs.code }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
