services:
  - type: web
    name: csbaby-sync-server
    env: node
    plan: free
    buildCommand: npm install && node -e "console.log('Build OK, version:', require('./package.json').version)"
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8080
    autoDeploy: yes
  - type: worker
    name: csbaby-sync-retry-worker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m infrastructure.sync.retry_worker
    envVars:
      - key: DATABASE_PATH
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SYNC_RETRY_INTERVAL_SECONDS
        value: "30"
# Force rebuild - clear cache