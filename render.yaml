services:
  # PostgreSQL 数据库
  - type: web
    name: csbaby-postgres
    plan: free
    envVars:
      - key: POSTGRES_PASSWORD
        generateValue: true

  # Node.js 后端服务
  - type: web
    name: csbaby-sync-server
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm test && echo "Deploy: $(date)"
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: csbaby-postgres
          property: connectionString
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: csbaby-postgres
          property: password
      - key: PGHOST
        fromDatabase:
          name: csbaby-postgres
          property: host
      - key: PGUSER
        fromDatabase:
          name: csbaby-postgres
          property: user
      - key: PGDATABASE
        fromDatabase:
          name: csbaby-postgres
          property: database
      - key: PORT
        value: 8080